[tool.poetry]
name = "bgpranking"
version = "2.1"
description = "BGP Ranking is a software to rank AS numbers based on their malicious activities."
authors = ["Raphaël Vinot <raphael.vinot@circl.lu>"]
license = "AGPLv3"

[tool.poetry.scripts]
start = "bin.start:main"
stop = "bin.stop:main"
update = "bin.update:main"
shutdown = "bin.shutdown:main"
run_backend = "bin.run_backend:main"
start_website = "bin.start_website:main"

archiver = "bin.archiver:main"
asn_descriptions = "bin.asn_descriptions:main"
dbinsert = "bin.dbinsert:main"
fetcher = "bin.fetcher:main"
parser = "bin.parser:main"
ranking = "bin.ranking:main"
sanitizer = "bin.sanitizer:main"
ssfetcher = "bin.ssfetcher:main"


[tool.poetry.dependencies]
python = "^3.11"
redis = {version = "^5.3.1", extras = ["hiredis"]}
flask-restx = "^1.3.2"
gunicorn = "^26.2.0"
python-dateutil = "^4.0.0"
pyipasnhistory = "^2.1.5"
pycountry = "^26.2.16"
beautifulsoup4 = "^4.15.0"
aiohttp = "^3.14.5"
Bootstrap-Flask = "^2.6.0"
pid = "^3.0.4"
pybgpranking2 = "^2.0.2"

[tool.poetry.group.dev.dependencies]
mypy = "^2.4.1"
types-setuptools = "^84.2.0.20261104"
types-redis = "^4.6.0.20241004"
types-requests = "^2.33.0.20261030"
types-python-dateutil = "^2.9.0.20261104"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = 3.11
check_untyped_defs = true
ignore_errors = false
ignore_missing_imports = false
strict_optional = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true

show_error_context = true
pretty = true
